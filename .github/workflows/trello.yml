# Trello automation only; consumer source is never executed by the sync job.
name: Trello
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, closed]
permissions:
  contents: read
  pull-requests: read
jobs:
  trello:
    uses: oz-tmg/trello-hub/.github/workflows/trello-sync.yml@bf2945de2290aa2688898f01849ead86fbc9932e
    with:
      runner-ref: bf2945de2290aa2688898f01849ead86fbc9932e
      configuration: ${{ vars.SPWF_CONFIG }}
      dry-run: ${{ vars.SPWF_LIVE != 'true' }}
      snapshot: ${{ vars.SPWF_SNAPSHOT }}
    secrets:
      TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
